[project]
name = "cr-variants"
version = "0.1.0"
description = "Cross-reference rare GL_DB germline-database variants across TSOPPI bioinformatics samples for contamination detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.44.2",
    "matplotlib>=3.11.2",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
