name: CR_variants - Build and Test Apptainer Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    container:
      image: ghcr.io/apptainer/apptainer:1.4.1
      options: --privileged

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Apptainer SIF image
      run: |
        cd $GITHUB_WORKSPACE/container
        apptainer build cr_variants.sif cr_variants.def


    - name: Test basic example with container
      run: |
        apptainer run \
          -B $GITHUB_WORKSPACE/data:/opt/cr_variants/data \
          $GITHUB_WORKSPACE/container/cr_variants.sif \
          --TSOPPI_folder /opt/cr_variants/data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --output_dir /tmp/cr_variants_container_test_basic


    - name: Display container results
      run: |
        echo "=== Intersection Matrix from Container ==="
        cat /tmp/cr_variants_container_test_basic/251211_NB552811_0117_AHTJM2BGYX_GL_DB_intersection_matrix.tsv

    - name: Test custom VAF threshold with container
      run: |
        apptainer run \
          -B $GITHUB_WORKSPACE/data:/opt/cr_variants/data \
          $GITHUB_WORKSPACE/container/cr_variants.sif \
          --TSOPPI_folder /opt/cr_variants/data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --VAF_th 0.001 \
          --output_dir /tmp/cr_variants_container_test_vaf


    - name: Test --tmp flag with container
      run: |
        apptainer run \
          -B $GITHUB_WORKSPACE/data:/opt/cr_variants/data \
          $GITHUB_WORKSPACE/container/cr_variants.sif \
          --TSOPPI_folder /opt/cr_variants/data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --output_dir /tmp/cr_variants_container_test_tmp \
          --tmp


    - name: Upload SIF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr_variants-sif
        path: container/cr_variants.sif
        retention-days: 30

    - name: Upload container test outputs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr_variants-container-test-outputs
        path: /tmp/cr_variants_container_test_basic/
        path: /tmp/cr_variants_container_test_vaf/
        path: /tmp/cr_variants_container_test_tmp/
        retention-days: 7