name: CR_variants - Build and Test Apptainer Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    container:
      image: ghcr.io/apptainer/apptainer:1.4.1
      options: --privileged

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build and Run Apptainer image 
      run: |
        apptainer build container/cr_variants.sif container/cr_variants.def

        apptainer run \
          -B data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX:/data \
          container/cr_variants.sif \
          --TSOPPI_folder /data \
          --output_dir /tmp/output

    - name: Upload SIF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr_variants-sif
        path: container/cr_variants.sif
        retention-days: 30