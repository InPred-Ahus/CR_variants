name: CR_variants - Build and Test Apptainer Container

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    container:
      image: ghcr.io/apptainer/apptainer:1.4.1
      options: --privileged

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Build and Run Apptainer image 
      run: |
        cd container                                                                                  ;
        apptainer build cr_variants.sif cr_variants.def                                               ;
        echo " "                                                                                      ;

        apptainer run                                                                                 \
          -B ../data:/opt/cr_variants/data                                                            \
          cr_variants.sif                                                                             \
          --TSOPPI_folder /opt/cr_variants/data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --output_dir /tmp/cr_variants_container_test_basic                                          ;