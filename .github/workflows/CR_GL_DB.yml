name: CR_variants - Build and Test cross_reference_GL_DB.py

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-with-uv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: uv sync --group dev --locked

    - name: Run unit tests
      run: uv run pytest tests/ -v

    - name: Run cross_reference_GL_DB.py - Basic example
      run: |
        mkdir -p TEST/cr_variants_test_basic                                         ;
        uv run cross_reference_GL_DB.py                                              \
          --TSOPPI_folder data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --alias "Test_Run_Basic"                                                   \
          --output_dir TEST/cr_variants_test_basic


    - name: Run with custom VAF threshold
      run: |
        mkdir -p TEST/cr_variants_test_vaf                                           ;
        uv run cross_reference_GL_DB.py                                              \
          --TSOPPI_folder data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --alias "Test_Run_Custom_VAF"                                              \
          --VAF_th 0.001                                                             \
          --output_dir TEST/cr_variants_test_vaf


    - name: Run with --tmp flag for per-sample tables
      run: |
        uv run cross_reference_GL_DB.py                                              \
          --TSOPPI_folder data/TSO500_postprocessing/251211_NB552811_0117_AHTJM2BGYX \
          --alias "Test_Run_Tmp"                                                     \
          --output_dir TEST/cr_variants_test_tmp                                     \
          --tmp


    - name: Upload test outputs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cr_variants-test-outputs
        path: TEST/cr_variants_test_basic/
        retention-days: 7
